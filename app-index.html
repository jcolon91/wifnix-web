<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06090F">
<title>Wifnix</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://wifnix.com/assets/favicon-32.png">
<link rel="apple-touch-icon" href="https://wifnix.com/assets/apple-touch-icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#06090F; --bg2:#0B121C; --card:#0F1825; --card2:#131F30;
    --bl:#0B8FCC; --bl-l:#29B6F6; --green:#00E5A0; --warn:#FFC107; --red:#FF5555; --purple:#8B5CF6;
    --white:#F0F4F8; --gray:#8BA0B4; --gray2:#5A6B7C; --line:rgba(255,255,255,0.06);
  }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--white); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; }
  .hidden { display:none !important; }
  button { font-family:inherit; cursor:pointer; border:none; }
  input, textarea, select { font-family:inherit; }
  a { color:var(--bl-l); text-decoration:none; }

  /* LOGIN */
  #login { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 24px; background:radial-gradient(circle at 50% 0%, rgba(11,143,204,0.12), transparent 60%), var(--bg); }
  #login .logo { width:150px; margin-bottom:10px; }
  #login .tagline { color:var(--gray); font-size:0.86rem; margin-bottom:30px; }
  .login-card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 22px; width:100%; max-width:390px; }
  .field { margin-bottom:15px; }
  .field label { display:block; font-size:0.72rem; font-weight:700; color:var(--gray); margin-bottom:7px; text-transform:uppercase; letter-spacing:0.05em; }
  .field input { width:100%; padding:14px; background:var(--bg2); border:1.5px solid var(--line); border-radius:11px; font-size:1rem; color:var(--white); transition:border .15s; }
  .field input:focus { outline:none; border-color:var(--bl); }
  .btn-primary { width:100%; padding:15px; background:var(--bl); color:#fff; border-radius:11px; font-size:1rem; font-weight:700; transition:opacity .15s; }
  .btn-primary:active { opacity:0.85; }
  .btn-primary:disabled { opacity:0.5; }
  #login-err { color:#fff; background:rgba(255,85,85,0.15); border:1px solid rgba(255,85,85,0.3); padding:10px 14px; border-radius:9px; font-size:0.84rem; margin-bottom:14px; text-align:center; }
  .login-foot { margin-top:18px; text-align:center; font-size:0.84rem; color:var(--gray); }

  /* APP SHELL */
  #app { min-height:100vh; min-height:100dvh; padding-bottom:80px; }
  .appbar { background:rgba(6,9,15,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:calc(14px + env(safe-area-inset-top)) 18px 14px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; border-bottom:1px solid var(--line); }
  .appbar .ab-title { font-size:1.15rem; font-weight:800; }
  .appbar .ab-sub { font-size:0.72rem; color:var(--gray); margin-top:1px; }
  .ab-icon { width:40px; height:40px; border-radius:11px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1.1rem; }

  .wrap { padding:18px; max-width:600px; margin:0 auto; }
  .view { display:none; }
  .view.active { display:block; animation:fade .25s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

  /* NAV INFERIOR */
  .botnav { position:fixed; bottom:0; left:0; right:0; background:rgba(11,18,28,0.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:60; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; color:var(--gray2); padding:6px 2px; transition:color .15s; position:relative; }
  .nav-btn svg { width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .nav-btn span { font-size:0.62rem; font-weight:600; }
  .nav-btn.active { color:var(--bl-l); }
  .nav-badge { position:absolute; top:0; right:50%; transform:translateX(16px); background:var(--red); color:#fff; font-size:0.55rem; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  /* CARDS */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; }
  .hero { background:linear-gradient(135deg, rgba(11,143,204,0.18), rgba(11,143,204,0.04)); border:1px solid rgba(11,143,204,0.2); border-radius:18px; padding:22px; margin-bottom:18px; }
  .hero h2 { font-size:1.35rem; font-weight:800; margin-bottom:5px; }
  .hero p { font-size:0.85rem; color:var(--gray); }

  .section-title { font-size:0.78rem; font-weight:800; color:var(--gray); text-transform:uppercase; letter-spacing:0.05em; margin:22px 4px 12px; }

  .quick-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .quick { background:var(--card); border:1px solid var(--line); border-radius:15px; padding:18px; display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:transform .12s, border-color .15s; text-align:left; }
  .quick:active { transform:scale(0.97); }
  .quick .q-ico { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
  .quick .q-ico svg { width:22px; height:22px; stroke-width:1.8; fill:none; }
  .quick .q-title { font-size:0.95rem; font-weight:800; color:var(--white); }
  .quick .q-sub { font-size:0.74rem; color:var(--gray); }

  .stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:8px; }
  .stat-box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 10px; text-align:center; }
  .stat-box .sn { font-size:1.5rem; font-weight:800; line-height:1; }
  .stat-box .sl { font-size:0.64rem; color:var(--gray); margin-top:6px; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; }

  .item { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:11px; }
  .item-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px; }
  .badge { display:inline-block; padding:3px 10px; border-radius:6px; font-size:0.68rem; font-weight:700; }

  .empty { text-align:center; padding:44px 20px; color:var(--gray2); }
  .empty svg { width:50px; height:50px; stroke:var(--gray2); fill:none; stroke-width:1.2; margin-bottom:12px; }
  .empty p { font-size:0.9rem; color:var(--gray); }
  .loading { text-align:center; padding:36px; color:var(--gray); font-size:0.9rem; }

  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--line); color:#fff; padding:13px 22px; border-radius:12px; font-size:0.88rem; font-weight:600; z-index:500; opacity:0; transition:opacity .2s; box-shadow:0 8px 30px rgba(0,0,0,0.5); }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <img src="https://wifnix.com/assets/logo-wifnix.png" class="logo" alt="Wifnix" onerror="this.style.display='none'">
  <div class="tagline">Tu cuenta Wifnix</div>
  <div class="login-card">
    <div id="login-err" class="hidden"></div>
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="l-email" placeholder="tu@correo.com" autocapitalize="off" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="l-btn" onclick="doLogin()">Entrar</button>
    <div class="login-foot">¿No tienes cuenta? <a href="https://wifnix.com" target="_blank">Regístrate en wifnix.com</a></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="appbar">
    <div>
      <div class="ab-title" id="ab-title">Inicio</div>
      <div class="ab-sub" id="ab-sub">—</div>
    </div>
    <div class="ab-icon" onclick="switchTab('cuenta')">👤</div>
  </div>

  <div class="wrap">
    <!-- TAB INICIO -->
    <div class="view active" id="view-inicio">
      <div class="hero">
        <h2 id="hero-saludo">Hola</h2>
        <p>¿Qué necesitas hoy?</p>
      </div>

      <div class="quick-grid">
        <button class="quick" onclick="switchTab('servicios'); subTab('citas')">
          <div class="q-ico" style="background:rgba(11,143,204,0.15)"><svg viewBox="0 0 24 24" style="stroke:var(--bl-l)"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
          <div><div class="q-title">Agendar</div><div class="q-sub">Mantenimiento</div></div>
        </button>
        <button class="quick" onclick="switchTab('tienda')">
          <div class="q-ico" style="background:rgba(0,229,160,0.15)"><svg viewBox="0 0 24 24" style="stroke:var(--green)"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg></div>
          <div><div class="q-title">Tienda</div><div class="q-sub">Equipos y más</div></div>
        </button>
        <button class="quick" onclick="switchTab('servicios'); subTab('garantias')">
          <div class="q-ico" style="background:rgba(139,92,246,0.15)"><svg viewBox="0 0 24 24" style="stroke:var(--purple)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>
          <div><div class="q-title">Garantías</div><div class="q-sub">Mis equipos</div></div>
        </button>
        <button class="quick" onclick="switchTab('servicios'); subTab('tickets')">
          <div class="q-ico" style="background:rgba(255,193,7,0.15)"><svg viewBox="0 0 24 24" style="stroke:var(--warn)"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div>
          <div><div class="q-title">Ayuda</div><div class="q-sub">Soporte</div></div>
        </button>
      </div>

      <div class="section-title">Resumen</div>
      <div class="stat-row">
        <div class="stat-box"><div class="sn" style="color:var(--bl-l)" id="st-ordenes">—</div><div class="sl">Órdenes</div></div>
        <div class="stat-box"><div class="sn" style="color:var(--green)" id="st-citas">—</div><div class="sl">Servicios</div></div>
        <div class="stat-box"><div class="sn" style="color:var(--purple)" id="st-garantias">—</div><div class="sl">Garantías</div></div>
      </div>

      <div id="proximo-servicio"></div>
    </div>

    <!-- TAB TIENDA (placeholder, se construye en Fase C) -->
    <div class="view" id="view-tienda">
      <div class="empty" style="padding-top:80px">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <p>La tienda llegará aquí muy pronto</p>
        <a href="https://wifnix.com" target="_blank" style="display:inline-block;margin-top:14px;padding:11px 20px;background:var(--bl);color:#fff;border-radius:10px;font-weight:700;font-size:0.85rem">Ir a la tienda web</a>
      </div>
    </div>

    <!-- TAB SERVICIOS (placeholder, se construye en Fase B) -->
    <div class="view" id="view-servicios">
      <div class="loading">Cargando servicios...</div>
    </div>

    <!-- TAB CUENTA (placeholder, se construye en Fase D) -->
    <div class="view" id="view-cuenta">
      <div class="card" id="cuenta-info"><div class="loading">Cargando...</div></div>
      <button class="btn-primary" style="background:rgba(255,85,85,0.15);color:var(--red);border:1px solid rgba(255,85,85,0.3)" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</div>

<!-- NAV INFERIOR -->
<div class="botnav hidden" id="botnav">
  <button class="nav-btn active" data-tab="inicio" onclick="switchTab('inicio')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Inicio</span>
  </button>
  <button class="nav-btn" data-tab="tienda" onclick="switchTab('tienda')">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
    <span>Tienda</span>
  </button>
  <button class="nav-btn" data-tab="servicios" onclick="switchTab('servicios')">
    <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
    <span>Servicios</span>
  </button>
  <button class="nav-btn" data-tab="cuenta" onclick="switchTab('cuenta')">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Cuenta</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script src="https://wifnix.com/assets/wifnix-core.js"></script>
<script>
var API = 'https://api.wifnix.com';
window.WIFNIX_TOKEN_KEY = 'wifnix_token';
var TOKEN = localStorage.getItem('wifnix_token');
var USER = null;
try { USER = JSON.parse(localStorage.getItem('wifnix_user') || 'null'); } catch(e) {}
var tabActual = 'inicio';
var datosCache = { ordenes:[], citas:[], garantias:[] };

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ---- API ----
async function api(path, opts) {
  if (window.Wifnix && window.Wifnix.api) return window.Wifnix.api(path, opts);
  var o = opts || {};
  o.headers = Object.assign({ 'Content-Type':'application/json' }, o.headers || {});
  if (TOKEN) o.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (o.body && typeof o.body === 'object') o.body = JSON.stringify(o.body);
  var r = await fetch(API + path, o);
  if (r.status === 401) { logout(); return null; }
  try { return await r.json(); } catch(e) { return null; }
}

// ---- LOGIN ----
async function doLogin() {
  var email = document.getElementById('l-email').value.trim();
  var pass = document.getElementById('l-pass').value;
  var err = document.getElementById('login-err');
  var btn = document.getElementById('l-btn');
  err.classList.add('hidden');
  if (!email || !pass) { err.textContent = 'Ingresa tu correo y contraseña'; err.classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    var r = await fetch(API + '/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email:email, password:pass })
    });
    var d = await r.json();
    if (d.token) {
      TOKEN = d.token;
      USER = d.usuario || d.user || d;
      localStorage.setItem('wifnix_token', TOKEN);
      localStorage.setItem('wifnix_user', JSON.stringify(USER));
      iniciarApp();
    } else {
      err.textContent = d.error || 'Correo o contraseña incorrectos'; err.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  } catch(e) {
    err.textContent = 'Error de conexión'; err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

function logout() {
  localStorage.removeItem('wifnix_token');
  localStorage.removeItem('wifnix_user');
  TOKEN = null; USER = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('botnav').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  var btn = document.getElementById('l-btn');
  btn.disabled = false; btn.textContent = 'Entrar';
  document.getElementById('l-pass').value = '';
}

async function iniciarApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('botnav').classList.remove('hidden');
  // Asegurar datos del usuario
  if (!USER || !USER.nombre) {
    try { USER = await api('/api/auth/me'); localStorage.setItem('wifnix_user', JSON.stringify(USER)); } catch(e) {}
  }
  var nombre = (USER && USER.nombre) ? USER.nombre : 'cliente';
  document.getElementById('hero-saludo').textContent = 'Hola, ' + nombre;
  document.getElementById('ab-sub').textContent = (USER && USER.email) ? USER.email : '';
  cargarInicio();
}

// ---- NAVEGACIÓN ----
var titulos = { inicio:'Inicio', tienda:'Tienda', servicios:'Mis Servicios', cuenta:'Mi Cuenta' };
function switchTab(tab) {
  tabActual = tab;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
  document.getElementById('ab-title').textContent = titulos[tab] || 'Wifnix';
  window.scrollTo(0,0);
  if (tab === 'servicios') cargarServicios();
  if (tab === 'cuenta') cargarCuenta();
}

// ---- TAB INICIO ----
async function cargarInicio() {
  try {
    var ordenes = await api('/api/ordenes/mis-ordenes') || [];
    var citas = (await api('/api/citas/mis-citas') || []).filter(function(c){ return c.status !== 'cancelada'; });
    var garantias = await api('/api/garantias/mis-garantias') || [];
    datosCache = { ordenes:ordenes, citas:citas, garantias:garantias };

    document.getElementById('st-ordenes').textContent = ordenes.length;
    document.getElementById('st-citas').textContent = citas.length;
    document.getElementById('st-garantias').textContent = garantias.filter(function(g){ return g.status === 'activa'; }).length;

    // Próximo servicio
    var proximas = citas.filter(function(c){ return ['solicitada','aprobada','confirmada','reprogramada'].includes(c.status); })
      .sort(function(a,b){ return new Date(a.fecha) - new Date(b.fecha); });
    var cont = document.getElementById('proximo-servicio');
    if (proximas.length) {
      var c = proximas[0];
      var fecha = window.Wifnix ? window.Wifnix.fechaPR(c.fecha) : c.fecha;
      var est = window.Wifnix ? window.Wifnix.estadoCita(c.status) : { label:c.status, color:'#0B8FCC' };
      cont.innerHTML = '<div class="section-title">Próximo servicio</div>' +
        '<div class="card" onclick="switchTab(\'servicios\')" style="cursor:pointer;border-color:rgba(11,143,204,0.25)">' +
          '<div class="item-top"><div><div style="font-weight:800;font-size:1rem">' + c.tipo_servicio + '</div>' +
          '<div style="font-size:0.8rem;color:var(--gray);margin-top:3px">📅 ' + fecha + ' · ' + (c.slot||'') + '</div></div>' +
          '<span class="badge" style="background:' + est.color + '22;color:' + est.color + '">' + est.label + '</span></div>' +
        '</div>';
    } else {
      cont.innerHTML = '<div class="section-title">Próximo servicio</div>' +
        '<div class="card" style="text-align:center;color:var(--gray)"><p style="font-size:0.88rem;margin-bottom:12px">No tienes servicios programados</p>' +
        '<button class="btn-primary" style="max-width:240px;margin:0 auto" onclick="switchTab(\'servicios\')">Agendar mantenimiento</button></div>';
    }
  } catch(e) {
    toast('Error al cargar datos');
  }
}

// ---- PLACEHOLDERS (se llenan en próximas fases) ----
async function cargarServicios() {
  document.getElementById('view-servicios').innerHTML = '<div class="loading">El detalle de servicios se construye en la siguiente fase</div>';
}
function subTab(t) { /* se implementa en Fase B */ }

async function cargarCuenta() {
  var nombre = (USER && USER.nombre) ? (USER.nombre + ' ' + (USER.apellido||'')) : '';
  document.getElementById('cuenta-info').innerHTML =
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">' +
      '<div style="width:56px;height:56px;border-radius:50%;background:rgba(11,143,204,0.15);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:var(--bl-l)">' + (nombre.charAt(0)||'U') + '</div>' +
      '<div><div style="font-weight:800;font-size:1.05rem">' + nombre + '</div>' +
      '<div style="font-size:0.82rem;color:var(--gray)">' + ((USER&&USER.email)||'') + '</div></div>' +
    '</div>';
}

// ---- INIT ----
if (TOKEN) { iniciarApp(); }
document.getElementById('l-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
