<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Wifnix LLC</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#06090F;--navy:#0D1526;--blue:#0B8FCC;--bl:#29B6F6;--white:#F0F4F8;--gray:#8BA0B4;--gray2:#3D5166;--card:#0D1A2A;--green:#00E5A0;--warn:#FFC107;--red:#FF5555;--orange:#F97316;--purple:#8B5CF6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--black);color:var(--white);min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid rgba(11,143,204,0.2);border-radius:16px;padding:36px;width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800}
.logo span{color:var(--red)}
.logo p{font-size:0.75rem;color:var(--gray);margin-top:4px}
.field{margin-bottom:14px}
.field label{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(11,143,204,0.15);border-radius:7px;padding:10px 13px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.84rem;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field input::placeholder,.field textarea::placeholder{color:var(--gray2)}
.field select option{background:var(--navy)}
.field textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{padding:12px;background:var(--blue);color:white;font-family:'Syne',sans-serif;font-weight:700;font-size:0.8rem;letter-spacing:0.06em;text-transform:uppercase;border-radius:8px;border:none;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--bl)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-full{width:100%}
.btn-ghost{background:transparent;color:var(--gray);border:1px solid rgba(255,255,255,0.1);padding:10px 16px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.82rem;transition:all .2s}
.btn-ghost:hover{border-color:var(--gray);color:var(--white)}
.btn-danger{background:rgba(255,85,85,0.12);color:var(--red);border:1px solid rgba(255,85,85,0.25);padding:10px 16px;border-radius:8px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:0.78rem;transition:all .2s}
.btn-danger:hover{background:var(--red);color:white}
.alert{padding:10px 13px;border-radius:7px;font-size:0.78rem;margin-bottom:12px;display:none}
.alert.err{background:rgba(255,85,85,0.1);border:1px solid rgba(255,85,85,0.25);color:var(--red)}
.alert.ok{background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.25);color:var(--green)}
.admin{display:none;min-height:100vh}
.sidebar{width:220px;background:var(--navy);border-right:1px solid rgba(255,255,255,0.05);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
.sb-logo{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,0.05)}
.sb-logo h2{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:800}
.sb-logo span{color:var(--red)}
.sb-user{padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.05)}
.sb-name{font-weight:700;color:var(--white);font-size:0.82rem}
.sb-rol{color:var(--gray);font-size:0.68rem;margin-top:2px}
.sb-nav{flex:1;padding:8px 0}
.nav-sep{font-size:0.55rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray2);padding:10px 20px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 20px;cursor:pointer;color:var(--gray);font-size:0.79rem;font-weight:500;border-left:2px solid transparent;border:none;background:none;width:100%;text-align:left;transition:all .2s}
.nav-item:hover{color:var(--white);background:rgba(255,255,255,0.03)}
.nav-item.active{color:var(--bl);background:rgba(11,143,204,0.08);border-left:2px solid var(--blue)}
.nav-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;flex-shrink:0}
.sb-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.05)}
.main{margin-left:220px;padding:24px;min-height:100vh}
.sec{display:none}
.sec.active{display:block}
.ph{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ph h1{font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:800}
.ph p{font-size:0.78rem;color:var(--gray);margin-top:3px}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.05);border-radius:12px;padding:20px;margin-bottom:16px}
.ct{font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:800;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:18px}
.sn{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;line-height:1;margin-bottom:4px}
.sl{font-size:0.6rem;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em}
.ss{font-size:0.68rem;color:var(--gray2);margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:0.6rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase}
.bb{background:rgba(11,143,204,0.15);color:var(--bl);border:1px solid rgba(11,143,204,0.2)}
.bg{background:rgba(0,229,160,0.12);color:var(--green);border:1px solid rgba(0,229,160,0.2)}
.bw{background:rgba(255,193,7,0.12);color:var(--warn);border:1px solid rgba(255,193,7,0.2)}
.br{background:rgba(255,85,85,0.12);color:var(--red);border:1px solid rgba(255,85,85,0.2)}
.bo{background:rgba(249,115,22,0.12);color:var(--orange);border:1px solid rgba(249,115,22,0.2)}
.bp{background:rgba(139,92,246,0.12);color:var(--purple);border:1px solid rgba(139,92,246,0.2)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{font-size:0.58rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray2);padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.04);white-space:nowrap}
td{font-size:0.79rem;color:var(--gray);padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.015)}
tr.selected td{background:rgba(11,143,204,0.05)}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fb{padding:6px 14px;border-radius:100px;font-size:0.72rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.08);color:var(--gray);background:transparent;transition:all .2s}
.fb:hover{border-color:rgba(11,143,204,0.3);color:var(--white)}
.fb.active{background:var(--blue);border-color:var(--blue);color:white}
.fb-blue{background:rgba(11,143,204,0.12);color:var(--bl);border-color:rgba(11,143,204,0.25)}
.search-in{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:6px 12px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.79rem;outline:none;min-width:180px}
.date-in{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:5px 10px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.75rem;outline:none}
.bulk-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,143,204,0.08);border:1px solid rgba(11,143,204,0.2);border-radius:8px;margin-bottom:12px;flex-wrap:wrap}
.bulk-bar.visible{display:flex}
.icon-btn{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.icon-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.ib-edit{background:rgba(11,143,204,0.12);color:var(--bl)}
.ib-edit:hover{background:var(--blue);color:white}
.ib-play{background:rgba(0,229,160,0.12);color:var(--green)}
.ib-play:hover{background:var(--green);color:var(--black)}
.ib-pause{background:rgba(255,193,7,0.12);color:var(--warn)}
.ib-pause:hover{background:var(--warn);color:var(--black)}
.ib-chat{background:rgba(139,92,246,0.12);color:var(--purple)}
.ib-chat:hover{background:var(--purple);color:white}
.ib-del{background:rgba(255,85,85,0.1);color:var(--red)}
.ib-del:hover{background:var(--red);color:white}
.actions-cell{display:flex;gap:5px;align-items:center}
.timer-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:0.65rem;font-weight:700;font-family:monospace;background:rgba(0,229,160,0.12);color:var(--green);border:1px solid rgba(0,229,160,0.2);cursor:help;position:relative}
.timer-badge.paused{background:rgba(255,193,7,0.12);color:var(--warn);border-color:rgba(255,193,7,0.2)}
.timer-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
.timer-badge.paused .timer-dot{background:var(--warn);animation:none}
.tooltip-wrap{position:relative;display:inline-block}
.tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid rgba(11,143,204,0.2);border-radius:8px;padding:10px 14px;white-space:nowrap;font-size:0.72rem;color:var(--white);pointer-events:none;opacity:0;transition:opacity .2s;z-index:100}
.tooltip-wrap:hover .tooltip{opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--navy);border:1px solid rgba(11,143,204,0.2);border-radius:14px;padding:28px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.mbox.sm{max-width:420px}
.mbox.lg{max-width:720px}
.mtitle{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;margin-bottom:18px}
.mfoot{display:flex;gap:10px;margin-top:16px}
.chat-msgs{height:240px;overflow-y:auto;border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:80%;padding:8px 12px;border-radius:10px;font-size:0.8rem;line-height:1.5}
.chat-msg.mine{align-self:flex-end;background:rgba(11,143,204,0.15);border:1px solid rgba(11,143,204,0.2);color:var(--white)}
.chat-msg.other{align-self:flex-start;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:var(--white)}
.chat-msg-meta{font-size:0.62rem;color:var(--gray2);margin-top:3px}
.chat-input-wrap{display:flex;gap:8px}
.chat-input{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(11,143,204,0.15);border-radius:7px;padding:9px 12px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.82rem;outline:none}
.danger-box{background:rgba(255,85,85,0.06);border:1px solid rgba(255,85,85,0.2);border-radius:10px;padding:16px;margin:14px 0;text-align:center}
.danger-icon{width:52px;height:52px;background:rgba(255,85,85,0.1);border:1px solid rgba(255,85,85,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty{text-align:center;padding:36px;color:var(--gray2);font-size:0.82rem}
.loading{text-align:center;padding:28px;color:var(--gray2);font-size:0.8rem}
.ham{display:none;position:fixed;top:14px;left:14px;z-index:300;background:var(--navy);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px;cursor:pointer;flex-direction:column;gap:4px}
.ham span{display:block;width:18px;height:2px;background:var(--white);border-radius:2px}
.audit-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.audit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.sidebar{transform:translateX(-100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:58px 14px 20px}.ham{display:flex}.g2,.g3{grid-template-columns:1fr}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="logo"><h1>Wifnix <span>Admin</span></h1><p>Acceso restringido — Personal autorizado</p></div>
    <div id="l-alert" class="alert"></div>
    <div class="field"><label>Email</label><input type="email" id="l-email" placeholder="admin@wifnix.com"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="l-pass" placeholder="••••••••"></div>
    <button class="btn btn-full" id="l-btn">Acceder al panel</button>
  </div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">
  <button class="ham" id="ham-btn"><span></span><span></span><span></span></button>
  <div class="sidebar" id="sidebar">
    <div class="sb-logo"><h2>Wifnix <span>Admin</span></h2></div>
    <div class="sb-user"><div class="sb-name" id="sb-name">—</div><div class="sb-rol" id="sb-rol">—</div></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot"><button id="logout-btn" style="width:100%;padding:8px;background:transparent;color:var(--gray);border:1px solid rgba(255,255,255,0.08);border-radius:7px;font-size:0.75rem;cursor:pointer;font-family:'DM Sans',sans-serif">Cerrar sesión</button></div>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- All Modals will be injected here -->
<div id="modals"></div>

<script>
// ════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════
var API = 'https://api.wifnix.com';
var TOKEN = localStorage.getItem('wifnix_admin_token');
var USER = null;

// Mapeos
var ROLES = {
  public: 'Público',
  cliente: 'Cliente',
  tecnico_independiente: 'Técnico Indep.',
  empresa_revendedora: 'Empresa Reseller',
  empresa_servicios: 'Empresa Servicios',
  admin_soporte: 'Admin Soporte',
  admin_inventario: 'Admin Inventario',
  admin_tecnico: 'Admin Técnico',
  admin_contabilidad: 'Admin Contabilidad',
  super_admin: 'Super Admin'
};

var ROLE_COLORS = {
  cliente: 'bb', tecnico_independiente: 'bo', empresa_revendedora: 'bp', empresa_servicios: 'bp',
  admin_soporte: 'bw', admin_inventario: 'bw', admin_tecnico: 'bw', admin_contabilidad: 'bw', super_admin: 'br'
};

var TICKET_STATUS = ['abierto', 'en_revision', 'en_proceso', 'resuelto', 'cerrado'];
var TICKET_STATUS_COLORS = {abierto:'bb', en_revision:'bw', en_proceso:'bo', resuelto:'bg', cerrado:'br'};
var TICKET_PRIORITIES = ['baja', 'media', 'alta', 'critica'];
var PRIORITY_COLORS = {baja:'bg', media:'bw', alta:'bo', critica:'br'};
var USER_STATUS = ['pendiente', 'activo', 'suspendido', 'bloqueado'];

var ADMIN_ROLES = ['super_admin', 'admin_soporte', 'admin_inventario', 'admin_tecnico', 'admin_contabilidad'];

// ════════════════════════════════════════════════
// API HELPER
// ════════════════════════════════════════════════
async function api(path, opts) {
  var o = opts || {};
  o.headers = Object.assign({'Content-Type': 'application/json'}, o.headers || {});
  if (TOKEN) o.headers['Authorization'] = 'Bearer ' + TOKEN;
  var r = await fetch(API + path, o);
  if (r.status === 401) { localStorage.removeItem('wifnix_admin_token'); location.reload(); return null; }
  return r.json();
}

// ════════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════════
document.getElementById('l-btn').onclick = doLogin;
document.getElementById('l-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

async function doLogin() {
  var email = document.getElementById('l-email').value.trim();
  var pass = document.getElementById('l-pass').value;
  var alert = document.getElementById('l-alert');
  var btn = document.getElementById('l-btn');
  
  if (!email || !pass) { showAlert(alert, 'Completa todos los campos'); return; }
  btn.disabled = true; btn.textContent = 'Verificando...';
  
  try {
    var r = await fetch(API + '/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: email, password: pass})
    });
    var d = await r.json();
    var u = d.usuario || d.user;
    
    if (d.token && u && ADMIN_ROLES.includes(u.rol)) {
      localStorage.setItem('wifnix_admin_token', d.token);
      TOKEN = d.token; USER = u;
      initAdmin();
    } else if (d.token) {
      showAlert(alert, 'No tienes permisos de administrador');
    } else {
      showAlert(alert, d.error || 'Credenciales incorrectas');
    }
  } catch(e) { showAlert(alert, 'Error de conexión'); }
  
  btn.disabled = false; btn.textContent = 'Acceder al panel';
}

function showAlert(el, msg, type) {
  el.className = 'alert ' + (type || 'err');
  el.textContent = msg;
  el.style.display = 'block';
}

document.getElementById('logout-btn').onclick = function() {
  localStorage.removeItem('wifnix_admin_token');
  location.reload();
};

document.getElementById('ham-btn').onclick = function() {
  document.getElementById('sidebar').classList.toggle('open');
};

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
function initAdmin() {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('admin').style.display = 'block';
  document.getElementById('sb-name').textContent = (USER.nombre || '') + ' ' + (USER.apellido || '');
  document.getElementById('sb-rol').textContent = ROLES[USER.rol] || USER.rol;
  buildSidebar();
  goSection('dashboard');
}

function buildSidebar() {
  var sections = [
    {sep: 'Principal'},
    {id: 'dashboard', label: 'Dashboard', icon: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>'},
    {sep: 'Clientes'},
    {id: 'usuarios', label: 'Usuarios', icon: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>'},
    {id: 'leads', label: 'Leads', icon: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'},
    {sep: 'Soporte'},
    {id: 'tickets', label: 'Tickets', icon: '<path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>'},
    {id: 'garantias', label: 'Garantías', icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>'},
    {id: 'resellers', label: 'Solicitudes Reseller', icon: '<path d="M20 21v-2a4 4 0 00-3-3.87"/><path d="M4 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><circle cx="9" cy="7" r="4"/><path d="M16 3.13a4 4 0 010 7.75"/>'},
    {sep: 'Ventas'},
    {id: 'ordenes', label: 'Órdenes', icon: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>'},
    {id: 'contabilidad', label: 'Contabilidad', icon: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>'},
    {sep: 'Inventario'},
    {id: 'productos', label: 'Productos', icon: '<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>'},
    {sep: 'Sistema'},
    {id: 'auditoria', label: 'Auditoría', icon: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'}
  ];
  
  var html = '';
  sections.forEach(function(s) {
    if (s.sep) html += '<div class="nav-sep">' + s.sep + '</div>';
    else html += '<button class="nav-item" data-sec="' + s.id + '"><svg viewBox="0 0 24 24">' + s.icon + '</svg>' + s.label + '</button>';
  });
  
  var nav = document.getElementById('sb-nav');
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(function(b) {
    b.onclick = function() { goSection(b.getAttribute('data-sec')); };
  });
}

function goSection(id) {
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  var navBtn = document.querySelector('.nav-item[data-sec="' + id + '"]');
  if (navBtn) navBtn.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  
  var loaders = {
    dashboard: renderDashboard, usuarios: renderUsuarios, leads: renderLeads,
    tickets: renderTickets, garantias: renderGarantias, resellers: renderResellers, ordenes: renderOrdenes,
    contabilidad: renderContabilidad, productos: renderProductos, auditoria: renderAuditoria
  };
  if (loaders[id]) loaders[id]();
}

function filtrarUsuarios() {
  var data = allUsuarios;
  if (usuariosFilter) data = data.filter(function(u){ return u.rol === usuariosFilter; });
  if (usuariosSearch) data = data.filter(function(u){
    return ((u.nombre || '') + (u.apellido || '') + u.email).toLowerCase().includes(usuariosSearch);
  });
  renderUsuariosTabla(data);
}

function renderUsuariosTabla(data) {

      '<td style="color:var(--white);font-weight:600">' + nom + '</td>' +
      '<td>' + u.email + '</td>' +
      '<td><span class="badge ' + (ROLE_COLORS[u.rol] || 'bb') + '">' + (ROLES[u.rol] || u.rol) + '</span></td>' +
      '<td><span class="badge ' + (u.telefono_verificado ? 'bg' : 'bw') + '">' + (u.telefono_verificado ? '✓' : '—') + '</span></td>' +

async function guardarUsuario(existing) {
  var alert = document.getElementById('u-alert');
  var btn = document.getElementById('u-save');
  var nombre = document.getElementById('u-nombre').value.trim();
  if (!nombre) { showAlert(alert, 'Nombre es requerido'); return; }
  
  var payload = {
    nombre: nombre,
    apellido: document.getElementById('u-apellido').value.trim(),
    telefono: document.getElementById('u-tel').value.trim(),
    rol: document.getElementById('u-rol').value,
    empresa_nombre: document.getElementById('u-empresa').value.trim(),
    empresa_tipo: document.getElementById('u-etipo').value.trim(),
    empresa_ein: document.getElementById('u-ein').value.trim()
  };
  
  if (existing) {
    payload.status = document.getElementById('u-status').value;
  } else {
    payload.email = document.getElementById('u-email').value.trim();
    payload.password = document.getElementById('u-pass').value;
    if (!payload.email || !payload.password) { showAlert(alert, 'Email y contraseña requeridos'); return; }
    if (payload.password.length < 8) { showAlert(alert, 'Contraseña mínimo 8 caracteres'); return; }
  }
  
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    var r = existing
      ? await api('/api/admin/usuarios/' + existing.id, {method: 'PUT', body: JSON.stringify(payload)})
      : await api('/api/admin/usuarios', {method: 'POST', body: JSON.stringify(payload)});
    if (r.ok || r.id) { cerrarModales(); renderUsuarios(); }
    else { showAlert(alert, r.error || 'Error al guardar'); btn.disabled = false; btn.textContent = existing ? 'Guardar cambios' : 'Crear usuario'; }
  } catch(e) { showAlert(alert, 'Error de conexión'); btn.disabled = false; btn.textContent = existing ? 'Guardar cambios' : 'Crear usuario'; }
}

    '<div style="font-size:0.8rem;color:var(--gray);line-height:1.7">Se eliminarán permanentemente la cuenta y <strong style="color:var(--white)">todos los datos asociados</strong> incluyendo tickets, garantías y órdenes. <strong style="color:var(--red)">No hay forma de recuperar esta información.</strong></div>' +
    '</div>' +
    '<div style="padding:10px 14px;background:rgba(255,85,85,0.06);border:1px solid rgba(255,85,85,0.15);border-radius:8px;margin-bottom:16px">' +
    '<div style="font-weight:700;color:var(--white)">' + nom + '</div>' +
    '<div style="font-size:0.75rem;color:var(--gray2)">' + u.email + '</div>' +
    '</div>' +
    '<div class="field"><label>Escribe <strong style="color:var(--red)">ELIMINAR</strong> para confirmar</label><input type="text" id="del-confirm" placeholder="ELIMINAR"></div>' +
    '<div id="del-alert" class="alert"></div>' +
    '<div class="mfoot">' +
    '<button class="btn-danger" id="del-go" style="flex:1;padding:12px">Eliminar permanentemente</button>' +
    '<button class="btn-ghost" id="del-cancel">Cancelar</button>' +
    '</div></div></div>';
  
  document.getElementById('modals').innerHTML = html;
  document.getElementById('del-cancel').onclick = cerrarModales;
  document.getElementById('del-go').onclick = async function() {
    var alert = document.getElementById('del-alert');
    if (document.getElementById('del-confirm').value.trim() !== 'ELIMINAR') {
      showAlert(alert, 'Debes escribir exactamente: ELIMINAR'); return;
    }
    var r = await api('/api/admin/usuarios/' + u.id, {method: 'DELETE'});
    if (r.ok) { cerrarModales(); renderUsuarios(); }
    else showAlert(alert, r.error || 'Error al eliminar');
  };
}

  var el = document.getElementById('t-tabla');

  Object.values(timerIntervals).forEach(clearInterval);
  timerIntervals = {};
  
  var rows = data.map(function(t, idx) {
    var trabajando = t.trabajando;
    var segs = parseInt(t.tiempo_total_segundos) || 0;
    var timerHtml = '';
    if (trabajando || segs > 0) {

      timerHtml = '<div class="tooltip-wrap"><span class="' + cls + '" id="timer-' + t.id + '">' + dot + fmtTimer(segs) + '</span>' +
        '<div class="tooltip">' + (trabajando ? '<strong style="color:var(--green)">En trabajo activo</strong><br>' : '<strong style="color:var(--warn)">Pausado</strong><br>') +
        'Tiempo: ' + fmtTimer(segs) + '</div></div>';
    }
    
    var puedeEliminar = ADMIN_ROLES.includes(USER.rol);
    var checked = selectedTks.has(t.id) ? 'checked' : '';
    return '<tr ' + (selectedTks.has(t.id) ? 'class="selected"' : '') + '>' +
      '<td style="width:32px"><input type="checkbox" class="t-chk" data-id="' + t.id + '" ' + checked + ' style="accent-color:var(--blue);width:14px;height:14px"></td>' +
      '<td style="color:var(--white);font-weight:700;font-size:0.82rem">#' + t.numero + '</td>' +
      '<td style="font-size:0.78rem">' + (t.nombre || '') + ' ' + (t.apellido || '') + '<div style="font-size:0.65rem;color:var(--gray2)">' + (t.email || '') + '</div></td>' +
      '<td style="color:var(--white);font-size:0.78rem">' + (t.asunto || '').slice(0,30) + '</td>' +
      '<td><span class="badge ' + (TICKET_STATUS_COLORS[t.status] || 'bb') + '">' + t.status.replace('_',' ') + '</span></td>' +
      '<td><span class="badge ' + (PRIORITY_COLORS[t.prioridad] || 'bw') + '">' + t.prioridad + '</span></td>' +
      '<td>' + timerHtml + '</td>' +
      '<td style="font-size:0.72rem;color:var(--gray2)">' + new Date(t.creado_en).toLocaleDateString('es-PR') + '</td>' +
      '<td class="actions-cell">' +
        '<button class="icon-btn ib-edit" title="Editar" data-action="edit" data-idx="' + idx + '"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>' +
        (trabajando
          ? '<button class="icon-btn ib-pause" title="Pausar" data-action="pause" data-id="' + t.id + '"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>'
          : '<button class="icon-btn ib-play" title="Iniciar" data-action="play" data-id="' + t.id + '"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>') +
        '<button class="icon-btn ib-chat" title="Chat / Gestionar" data-action="edit" data-idx="' + idx + '"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></button>' +
        (puedeEliminar ? '<button class="icon-btn ib-del" title="Eliminar" data-action="del" data-id="' + t.id + '"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>' : '') +
      '</td></tr>';
  }).join('');
  
  el.innerHTML = '<table><thead><tr><th><input type="checkbox" id="chk-all" style="accent-color:var(--blue);width:14px;height:14px"></th><th>#</th><th>Cliente</th><th>Asunto</th><th>Estado</th><th>Prioridad</th><th>Tiempo</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>' + rows + '</tbody></table>';
  
  // Start live timers
  data.forEach(function(t) {
    if (t.trabajando && t.tiempo_inicio) {
      var startTime = new Date(t.tiempo_inicio).getTime();
      var baseSegs = parseInt(t.tiempo_total_segundos) || 0;
      timerIntervals[t.id] = setInterval(function() {
        var el = document.getElementById('timer-' + t.id);
        if (!el) { clearInterval(timerIntervals[t.id]); return; }
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        el.innerHTML = '<span class="timer-dot"></span>' + fmtTimer(baseSegs + elapsed);
      }, 1000);
    }
  });
  
  // Bind actions
  el.querySelectorAll('[data-action]').forEach(function(btn) {
    btn.onclick = async function() {
      var action = btn.getAttribute('data-action');
      var id = btn.getAttribute('data-id');
      var idx = btn.getAttribute('data-idx');
      
      if (action === 'edit') { abrirModalTicket(data[parseInt(idx)]); }
      else if (action === 'play') { await api('/api/admin/tickets/' + id + '/iniciar', {method: 'POST'}); renderTickets(); }
      else if (action === 'pause') { await api('/api/admin/tickets/' + id + '/pausar', {method: 'POST'}); renderTickets(); }
      else if (action === 'del') {
        if (!confirm('¿Eliminar este ticket? Esta acción es permanente.')) return;
        await api('/api/admin/tickets/' + id, {method: 'DELETE'});
        renderTickets();
      }
    };
  });
  
  // Bind checkboxes
  el.querySelectorAll('.t-chk').forEach(function(c) {
    c.onchange = function() {
      var id = c.getAttribute('data-id');
      if (c.checked) selectedTks.add(id); else selectedTks.delete(id);
      c.closest('tr').classList.toggle('selected', c.checked);
      renderBulkBar();
    };
  });
  
  document.getElementById('chk-all').onchange = function() {
    var chk = this.checked;
    el.querySelectorAll('.t-chk').forEach(function(c) {
      c.checked = chk;
      var id = c.getAttribute('data-id');
      if (chk) selectedTks.add(id); else selectedTks.delete(id);
      c.closest('tr').classList.toggle('selected', chk);
    });
    renderBulkBar();
  };
  
  renderBulkBar();
}

function renderBulkBar() {
  var bar = document.getElementById('t-bulk');
  if (!bar) return;
  if (selectedTks.size === 0) { bar.classList.remove('visible'); return; }
  
  bar.classList.add('visible');
  bar.innerHTML = '<span style="font-size:0.78rem;color:var(--bl);font-weight:600">' + selectedTks.size + ' seleccionado' + (selectedTks.size > 1 ? 's' : '') + '</span>' +
    '<select id="bulk-status" class="search-in" style="min-width:140px;font-size:0.75rem"><option value="">Cambiar estado...</option>' +
    TICKET_STATUS.map(function(s){ return '<option value="' + s + '">' + s.replace('_',' ') + '</option>'; }).join('') +
    '</select>' +
    '<button class="fb fb-blue" id="bulk-apply">Aplicar</button>' +
    '<button class="fb" style="background:rgba(255,85,85,0.1);color:var(--red);border-color:rgba(255,85,85,0.2)" id="bulk-del">Eliminar seleccionados</button>' +
    '<button class="fb" id="bulk-cancel">Cancelar</button>';
  
  document.getElementById('bulk-apply').onclick = async function() {
    var status = document.getElementById('bulk-status').value;
    if (!status) { alert('Selecciona un estado'); return; }
    await Promise.all(Array.from(selectedTks).map(function(id) {
      return api('/api/admin/tickets/' + id, {method: 'PUT', body: JSON.stringify({status: status})});
    }));
    selectedTks.clear();
    renderTickets();
  };
  
  document.getElementById('bulk-del').onclick = async function() {
    if (!confirm('¿Eliminar los ' + selectedTks.size + ' tickets seleccionados? Permanente.')) return;
    await Promise.all(Array.from(selectedTks).map(function(id) {
      return api('/api/admin/tickets/' + id, {method: 'DELETE'});
    }));
    selectedTks.clear();
    renderTickets();
  };
  
  document.getElementById('bulk-cancel').onclick = function() {
    selectedTks.clear();
    renderTickets();
  };
}

function fmtTimer(segundos) {
  var h = Math.floor(segundos / 3600);
  var m = Math.floor((segundos % 3600) / 60);
  var s = segundos % 60;
  return (h > 0 ? h + 'h ' : '') + String(m).padStart(2, '0') + 'm ' + String(s).padStart(2, '0') + 's';
}

async function abrirModalTicket(t) {

  // For new tickets, need user list
  var userOptions = '';
  if (isNew) {
    var users = await api('/api/admin/usuarios');
    userOptions = (users || []).map(function(u){
      return '<option value="' + u.id + '">' + ((u.nombre || '') + ' ' + (u.apellido || '')).trim() + ' — ' + u.email + '</option>';
    }).join('');
  }
  
  var html = '<div class="modal" style="display:flex"><div class="mbox">' +
    '<div class="mtitle">' + (isNew ? 'Nuevo Ticket' : 'Ticket #' + t.numero) + '</div>' +
    (isNew ? '<div class="field"><label>Cliente *</label><select id="t-usuario"><option value="">Selecciona un cliente</option>' + userOptions + '</select></div>' +
      '<div class="field"><label>Asunto *</label><input type="text" id="t-asunto" placeholder="Resumen del problema"></div>' +
      '<div class="field"><label>Descripción</label><textarea id="t-desc" placeholder="Describe el problema..."></textarea></div>' +
      '<div class="field"><label>Categoría</label><select id="t-cat">' +
      '<option value="soporte">Soporte técnico</option><option value="garantia">Garantía</option><option value="mantenimiento">Mantenimiento</option>' +
      '<option value="instalacion">Instalación</option><option value="facturacion">Facturación</option><option value="general">General</option>' +
      '</select></div>' : '') +
    '<div class="g2">' +
    '<div class="field"><label>Estado</label><select id="t-status">' +
    TICKET_STATUS.map(function(s){ return '<option value="' + s + '" ' + (t && t.status === s ? 'selected' : '') + '>' + s.replace('_',' ') + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="field"><label>Prioridad</label><select id="t-prio">' +
    TICKET_PRIORITIES.map(function(p){ return '<option value="' + p + '" ' + (t && t.prioridad === p ? 'selected' : 'media' === p && !t ? 'selected' : '') + '>' + p + '</option>'; }).join('') +
    '</select></div>' +
    '</div>' +
    (isNew ? '' : '<div style="font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin:14px 0 10px">Chat interno</div>' +
      '<div class="chat-msgs" id="t-chat"><div class="loading">Cargando...</div></div>' +
      '<div class="chat-input-wrap"><input class="chat-input" id="t-chat-input" placeholder="Mensaje al equipo..."><button class="fb fb-blue" id="t-chat-send">Enviar</button></div>') +
    '<div id="t-alert" class="alert" style="margin-top:12px"></div>' +
    '<div class="mfoot">' +
    '<button class="btn" id="t-save" style="flex:1">' + (isNew ? 'Crear ticket' : 'Guardar cambios') + '</button>' +
    '<button class="btn-ghost" id="t-cancel">Cerrar</button>' +
    '</div></div></div>';
  
  document.getElementById('modals').innerHTML = html;
  document.getElementById('t-cancel').onclick = cerrarModales;
  document.getElementById('t-save').onclick = function() { guardarTicket(t); };
  
  if (!isNew) {
    cargarChat(t.id);
    document.getElementById('t-chat-send').onclick = function() { enviarMensaje(t.id); };
    document.getElementById('t-chat-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensaje(t.id); }
    });
  }
}

async function guardarTicket(existing) {
  var alert = document.getElementById('t-alert');
  var btn = document.getElementById('t-save');
  
  if (existing) {
    btn.disabled = true; btn.textContent = 'Guardando...';
    var r = await api('/api/admin/tickets/' + existing.id, {method: 'PUT', body: JSON.stringify({
      status: document.getElementById('t-status').value,
      prioridad: document.getElementById('t-prio').value
    })});
    if (r.ok) { cerrarModales(); renderTickets(); }
    else { showAlert(alert, r.error || 'Error'); btn.disabled = false; btn.textContent = 'Guardar cambios'; }
  } else {
    var usuario_id = document.getElementById('t-usuario').value;
    var asunto = document.getElementById('t-asunto').value.trim();
    var desc = document.getElementById('t-desc').value.trim();
    if (!usuario_id || !asunto) { showAlert(alert, 'Cliente y asunto requeridos'); return; }
    
    btn.disabled = true; btn.textContent = 'Creando...';
    var r = await api('/api/admin/tickets', {method: 'POST', body: JSON.stringify({
      usuario_id: usuario_id,
      asunto: asunto,
      descripcion: desc,
      categoria: document.getElementById('t-cat').value,
      status: document.getElementById('t-status').value,
      prioridad: document.getElementById('t-prio').value
    })});
    if (r.ok || r.id) { cerrarModales(); renderTickets(); }
    else { showAlert(alert, r.error || 'Error'); btn.disabled = false; btn.textContent = 'Crear ticket'; }
  }
}

async function cargarChat(ticketId) {
  var msgs = await api('/api/admin/tickets/' + ticketId + '/mensajes') || [];
  var el = document.getElementById('t-chat');
  if (!msgs.length) { el.innerHTML = '<div style="text-align:center;color:var(--gray2);font-size:0.75rem;padding:20px">Sin mensajes aún</div>'; return; }
  el.innerHTML = msgs.map(function(m) {
    var isMine = m.usuario_id === USER.id;
    return '<div class="chat-msg ' + (isMine ? 'mine' : 'other') + '">' + m.mensaje +
      '<div class="chat-msg-meta">' + (m.nombre || 'Usuario') + ' · ' + new Date(m.creado_en).toLocaleTimeString('es-PR', {hour:'2-digit', minute:'2-digit'}) + '</div></div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

async function enviarMensaje(ticketId) {
  var input = document.getElementById('t-chat-input');
  var msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  await api('/api/admin/tickets/' + ticketId + '/mensaje', {method: 'POST', body: JSON.stringify({mensaje: msg})});
  cargarChat(ticketId);
}

async function exportarExcel(desde, hasta) {
  var data = await api('/api/admin/ventas') || [];
  var filtered = data.filter(function(o) { var f = new Date(o.creado_en).toISOString().split('T')[0]; return f >= desde && f <= hasta; });
  if (!filtered.length) { alert('No hay datos para exportar en este periodo'); return; }
  var rows = filtered.map(function(o) {
    return {
      'Número Orden': o.numero || o.id.slice(0,8).toUpperCase(),
      'Cliente': (o.nombre || '') + ' ' + (o.apellido || ''),
      'Email': o.email || '',
      'Tipo': o.tipo || '',
      'Subtotal': parseFloat(o.subtotal) || 0,
      'Descuento': parseFloat(o.descuento_monto) || 0,
      'Impuesto': parseFloat(o.impuesto) || 0,
      'Total': parseFloat(o.total) || 0,
      'Estado': o.status || '',
      'Municipio': o.municipio || '',
      'Fecha Creación': new Date(o.creado_en).toLocaleDateString('es-PR'),
      'Fecha Completado': o.completado_en ? new Date(o.completado_en).toLocaleDateString('es-PR') : ''
    };
  });
  // Add summary row
  var totalSub = filtered.reduce(function(s,o){return s+(parseFloat(o.subtotal)||0);},0);
  var totalImp = filtered.reduce(function(s,o){return s+(parseFloat(o.impuesto)||0);},0);
  var totalTot = filtered.reduce(function(s,o){return s+(parseFloat(o.total)||0);},0);
  rows.push({});
  rows.push({'Número Orden': 'TOTALES', 'Subtotal': totalSub, 'Impuesto': totalImp, 'Total': totalTot});
  
  var ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:25},{wch:25},{wch:15},{wch:12},{wch:12},{wch:12},{wch:12},{wch:15},{wch:15},{wch:15},{wch:15}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Contabilidad');
  var fileName = 'wifnix-contabilidad-' + desde + '-a-' + hasta + '.xlsx';
  XLSX.writeFile(wb, fileName);
}

async function cargarContabilidad(desde, hasta) {
  var data = await api('/api/admin/ventas') || [];
  var filtered = data.filter(function(o) { var f = new Date(o.creado_en).toISOString().split('T')[0]; return f >= desde && f <= hasta; });
  var totalRevenue = filtered.reduce(function(s, o){ return s + (parseFloat(o.total) || 0); }, 0);
  var completadas = filtered.filter(function(o){ return o.status === 'completado' || o.status === 'pagado'; });
  var revenueCompletado = completadas.reduce(function(s, o){ return s + (parseFloat(o.total) || 0); }, 0);
  var pendientes = filtered.filter(function(o){ return o.status === 'pendiente_pago' || o.status === 'borrador'; });
  document.getElementById('c-stats').innerHTML = 
    '<div class="sc"><div class="sn" style="color:var(--green)">$' + revenueCompletado.toLocaleString('en-US', {minimumFractionDigits:2}) + '</div><div class="sl">Ingresos confirmados</div><div class="ss">' + completadas.length + ' órdenes pagadas</div></div>' +
    '<div class="sc"><div class="sn" style="color:var(--warn)">$' + (totalRevenue - revenueCompletado).toLocaleString('en-US', {minimumFractionDigits:2}) + '</div><div class="sl">Pendiente</div><div class="ss">' + pendientes.length + ' órdenes</div></div>' +
    '<div class="sc"><div class="sn" style="color:var(--bl)">$' + totalRevenue.toLocaleString('en-US', {minimumFractionDigits:2}) + '</div><div class="sl">Total facturado</div><div class="ss">' + filtered.length + ' órdenes</div></div>' +
    '<div class="sc"><div class="sn" style="color:var(--purple)">$' + (filtered.length ? (totalRevenue/filtered.length).toFixed(2) : '0.00') + '</div><div class="sl">Ticket promedio</div><div class="ss">Por orden</div></div>';
  var el = document.getElementById('c-tabla');
  if (!filtered.length) { el.innerHTML = '<div class="empty">Sin transacciones en este periodo</div>'; return; }
  el.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Orden</th><th>Cliente</th><th>Tipo</th><th>Subtotal</th><th>Impuesto</th><th>Total</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>' +
    filtered.map(function(o) {
      return '<tr><td style="color:var(--white);font-family:monospace;font-size:0.72rem">#' + (o.numero || o.id.slice(0,8).toUpperCase()) + '</td>' +
        '<td>' + (o.nombre || '') + ' ' + (o.apellido || '') + '</td>' +
        '<td style="font-size:0.72rem">' + (o.tipo || '—') + '</td>' +
        '<td>$' + (parseFloat(o.subtotal) || 0).toFixed(2) + '</td>' +
        '<td style="font-size:0.72rem;color:var(--gray2)">$' + (parseFloat(o.impuesto) || 0).toFixed(2) + '</td>' +
        '<td style="color:var(--green);font-weight:700">$' + (parseFloat(o.total) || 0).toFixed(2) + '</td>' +
        '<td><span class="badge ' + (o.status === 'completado' || o.status === 'pagado' ? 'bg' : 'bw') + '">' + (o.status || '—') + '</span></td>' +
        '<td style="font-size:0.72rem">' + new Date(o.creado_en).toLocaleDateString('es-PR') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

async function renderProductos() {

  document.getElementById('p-filters').innerHTML = 
    '<button class="fb active" data-f="todos">Todos</button>' +
    '<button class="fb" data-f="activo">Activos</button>' +
    '<button class="fb" data-f="sin_stock">Sin stock</button>' +

      renderProductosTabla();
    };
  });
  allProductos = await api('/api/productos') || [];

function renderProductosTabla() {
  var data = allProductos;
  if (productosFilter === 'activo') data = data.filter(function(p){ return p.activo; });
  else if (productosFilter === 'sin_stock') data = data.filter(function(p){ return p.stock === 0; });
  else if (productosFilter === 'nuevo') data = data.filter(function(p){ return p.es_nuevo; });
  else if (productosFilter === 'hot') data = data.filter(function(p){ return p.es_hot; });
  var el = document.getElementById('p-tabla');
  if (!data.length) { el.innerHTML = '<div class="empty">Sin productos</div>'; return; }
  var rows = data.map(function(p, idx) {
    var stockColor = p.stock === 0 ? 'var(--red)' : p.stock <= p.stock_minimo ? 'var(--warn)' : 'var(--green)';
    return '<tr><td><div style="color:var(--white);font-weight:600">' + (p.nombre_es || p.nombre || '') + '</div><div style="font-size:0.68rem;color:var(--gray2)">' + (p.marca || '') + ' ' + (p.modelo || '') + '</div></td>' +
      '<td style="font-family:monospace;font-size:0.72rem;color:var(--gray2)">' + (p.sku || '') + '</td>' +
      '<td style="color:var(--green);font-weight:600">' + (p.precio_publico ? '$' + parseFloat(p.precio_publico).toFixed(2) : '—') + '</td>' +
      '<td style="color:var(--red);text-decoration:line-through;font-size:0.72rem">' + (p.precio_anterior ? '$' + parseFloat(p.precio_anterior).toFixed(2) : '') + '</td>' +
      '<td style="color:' + stockColor + ';font-weight:700">' + (p.stock || 0) + '</td>' +
      '<td>' + (p.es_nuevo ? '<span class="badge bg" style="margin-right:3px">NEW</span>' : '') + (p.es_hot ? '<span class="badge br">HOT</span>' : '') + '</td>' +
      '<td><span class="badge ' + (p.activo ? 'bg' : 'br') + '">' + (p.activo ? 'Activo' : 'Inactivo') + '</span></td>' +
      '<td class="actions-cell"><button class="icon-btn ib-edit" data-idx="' + idx + '"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></td></tr>';
  }).join('');
  el.innerHTML = '<table><thead><tr><th>Producto</th><th>SKU</th><th>Precio</th><th>Anterior</th><th>Stock</th><th>Tags</th><th>Estado</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  el.querySelectorAll('[data-idx]').forEach(function(b) {
    b.onclick = function() { abrirModalProducto(data[parseInt(b.getAttribute('data-idx'))]); };
  });
}

  document.getElementById('modals').innerHTML = html;

async function guardarProducto(existing) {
  var alert = document.getElementById('p-alert');
  var btn = document.getElementById('p-save');
  var sku = document.getElementById('p-sku').value.trim();
  var nombre = document.getElementById('p-nombre').value.trim();
  if (!sku || !nombre) { showAlert(alert, 'SKU y nombre son requeridos'); return; }
  btn.disabled = true; btn.textContent = 'Guardando...';
  var payload = {
    sku: sku, nombre_es: nombre,
    marca: document.getElementById('p-marca').value,
    modelo: document.getElementById('p-modelo').value,
    descripcion_es: document.getElementById('p-desc').value,
    precio_publico: parseFloat(document.getElementById('p-pub').value) || null,
    precio_anterior: parseFloat(document.getElementById('p-ant').value) || null,
    precio_cliente: parseFloat(document.getElementById('p-cli').value) || null,
    precio_empresa: parseFloat(document.getElementById('p-emp').value) || null,
    precio_revendedor: parseFloat(document.getElementById('p-res').value) || null,
    precio_sugerido_reventa: parseFloat(document.getElementById('p-sug').value) || null,
    stock: parseInt(document.getElementById('p-stock').value) || 0,
    stock_minimo: parseInt(document.getElementById('p-smin').value) || 5,
    es_nuevo: document.getElementById('p-nuevo').checked,
    es_hot: document.getElementById('p-hot').checked,
    activo: document.getElementById('p-activo').checked,
    imagen_principal: prodImg,
    archivos: prodArchivos
  };
  var r = existing
    ? await api('/api/admin/productos-v2/' + existing.id, {method: 'PUT', body: JSON.stringify(payload)})
    : await api('/api/admin/productos-v2', {method: 'POST', body: JSON.stringify(payload)});
  if (r.ok || r.id) { cerrarModales(); renderProductos(); }
  else { showAlert(alert, r.error || 'Error al guardar'); btn.disabled = false; btn.textContent = existing ? 'Guardar cambios' : 'Crear producto'; }
}

    '<div class="field"><label style="display:flex;justify-content:space-between;align-items:center"><span>Si rechazas — razón (se envía al cliente)</span><button id="r-mejorar" onclick="mejorarRazon()" type="button" style="background:rgba(139,92,246,0.12);color:var(--purple);border:1px solid rgba(139,92,246,0.25);border-radius:5px;padding:3px 9px;font-size:0.65rem;cursor:pointer;font-weight:600">✨ Mejorar con IA</button></label><textarea id="r-razon" placeholder="Razón del rechazo..."></textarea></div>' +
    '<div class="field"><label style="display:flex;justify-content:space-between;align-items:center"><span>Si pides info — qué necesitas</span><button id="r-mejorar2" onclick="mejorarInfo()" type="button" style="background:rgba(139,92,246,0.12);color:var(--purple);border:1px solid rgba(139,92,246,0.25);border-radius:5px;padding:3px 9px;font-size:0.65rem;cursor:pointer;font-weight:600">✨ Mejorar con IA</button></label><textarea id="r-info" placeholder="Por favor envíanos..."></textarea></div>' +
    '</div>' +
    '<div id="r-alert" class="alert"></div>' +
    '<div class="mfoot" style="flex-wrap:wrap">' +
    '<button class="btn" id="r-aprobar" style="flex:1;background:var(--success);min-width:140px">✓ Aprobar</button>' +
    '<button class="btn" id="r-info-btn" style="flex:1;background:var(--warn);color:var(--black);min-width:140px">? Solicitar info</button>' +
    '<button class="btn-danger" id="r-rechazar" style="flex:1;min-width:140px">✗ Rechazar</button>' +
    '<button class="btn-ghost" id="r-cancel">Cerrar</button>' +
    '</div></div></div>';
  
  document.getElementById('modals').innerHTML = html;
  document.getElementById('r-cancel').onclick = cerrarModales;
  document.getElementById('r-aprobar').onclick = function() { decidirReseller(s.id, 'aprobar'); };
  document.getElementById('r-rechazar').onclick = function() { decidirReseller(s.id, 'rechazar'); };
  document.getElementById('r-info-btn').onclick = function() { decidirReseller(s.id, 'solicitar_info'); };
}

async function decidirReseller(id, accion) {
  var alert = document.getElementById('r-alert');
  var notas = document.getElementById('r-notas').value.trim();
  var razon = document.getElementById('r-razon').value.trim();
  var info = document.getElementById('r-info').value.trim();
  
  if (accion === 'rechazar' && !razon) { showAlert(alert, 'Debes indicar la razón del rechazo'); return; }
  if (accion === 'solicitar_info' && !info) { showAlert(alert, 'Debes indicar qué información necesitas'); return; }
  
  if (!confirm('¿Confirmas la decisión? Se enviará un email al cliente.')) return;
  
  var r = await api('/api/admin/solicitudes-reseller/' + id, {
    method: 'PUT',
    body: JSON.stringify({accion: accion, notas_admin: notas, razon_rechazo: razon, info_adicional_solicitada: info})
  });
  if (r.ok) { cerrarModales(); renderResellers(); }
  else { showAlert(alert, r.error || 'Error'); }
}

function verDocumento(tipo) {
  if (!currentSolicitud) return;
  var data = tipo === 'registro' ? currentSolicitud.documento_registro : currentSolicitud.documento_identificacion;
  if (!data) { alert('No hay documento'); return; }
  try {
    var match = data.match(/^data:([^;]+);base64,(.+)$/);
    if (!match) { alert('Formato de documento inválido'); return; }
    var mimeType = match[1];
    var b64 = match[2];
    var byteCharacters = atob(b64);
    var byteArrays = [];
    for (var offset = 0; offset < byteCharacters.length; offset += 512) {
      var slice = byteCharacters.slice(offset, offset + 512);
      var byteNumbers = new Array(slice.length);
      for (var i = 0; i < slice.length; i++) byteNumbers[i] = slice.charCodeAt(i);
      byteArrays.push(new Uint8Array(byteNumbers));
    }
    var blob = new Blob(byteArrays, {type: mimeType});
    var blobUrl = URL.createObjectURL(blob);
    var ext = mimeType.includes('pdf') ? 'pdf' : mimeType.includes('png') ? 'png' : mimeType.includes('jpeg') ? 'jpg' : 'bin';
    var fileName = tipo + '-' + (currentSolicitud.email || 'doc').split('@')[0] + '.' + ext;
    var a = document.createElement('a');
    a.href = blobUrl;
    a.download = fileName;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 60000);
  } catch(e) {
    console.error('Error mostrando documento:', e);
    alert('Error: ' + e.message);
  }
}

async function mejorarInfo() {
  var txt = document.getElementById('r-info').value.trim();
  if (!txt) { alert('Escribe primero qué información necesitas'); return; }
  var btn = document.getElementById('r-mejorar2');
  btn.disabled = true; btn.textContent = 'Mejorando...';
  try {
    var r = await api('/api/admin/ai-mejorar-texto', {
      method: 'POST',
      body: JSON.stringify({texto: txt, contexto: 'Solicitud de información adicional para procesar aplicación de reseller. Reescribe en tono profesional, claro y amable. Lista claramente qué necesitamos. Máximo 4 oraciones.'})
    });
    if (r.texto) document.getElementById('r-info').value = r.texto;
    else alert(r.error || 'Error');
  } catch(e) { alert('Error de conexión'); }
  btn.disabled = false; btn.textContent = '✨ Mejorar con IA';
}

async function mejorarRazon() {
  var txt = document.getElementById('r-razon').value.trim();
  if (!txt) { alert('Escribe primero la razón en bruto'); return; }
  var btn = document.getElementById('r-mejorar');
  btn.disabled = true; btn.textContent = 'Mejorando...';
  try {
    var r = await api('/api/admin/ai-mejorar-texto', {
      method: 'POST',
      body: JSON.stringify({texto: txt, contexto: 'Razón de rechazo a solicitud de reseller. Reescribe en tono profesional, empático y constructivo, manteniendo el mensaje claro. Máximo 3 oraciones.'})
    });
    if (r.texto) {
      document.getElementById('r-razon').value = r.texto;
    } else {
      alert(r.error || 'Error mejorando texto');
    }
  } catch(e) { alert('Error de conexión'); }
  btn.disabled = false; btn.textContent = '✨ Mejorar con IA';
}

async function renderAuditoria() {
  var main = document.getElementById('main');
  main.innerHTML = '<div class="ph"><div><h1>Auditoría</h1><p>Registro de actividad del sistema</p></div></div>' +
    '<div class="card"><div id="a-lista"><div class="loading">Cargando...</div></div></div>';
  var data = await api('/api/admin/auditoria') || [];
  var el = document.getElementById('a-lista');
  if (!data.length) { el.innerHTML = '<div class="empty">Sin actividad registrada</div>'; return; }
  var colors = {registro: 'var(--green)', ticket: 'var(--blue)', lead: 'var(--orange)'};
  el.innerHTML = data.map(function(a) {
    return '<div class="audit-item">' +
      '<div class="audit-dot" style="background:' + (colors[a.tipo] || 'var(--gray)') + '"></div>' +
      '<div style="flex:1"><div style="font-size:0.8rem;color:var(--white)">' + (a.descripcion || '') + '</div><div style="font-size:0.7rem;color:var(--gray2);margin-top:2px">' + (a.email || a.status || '') + '</div></div>' +
      '<div style="font-size:0.68rem;color:var(--gray2);flex-shrink:0">' + new Date(a.fecha).toLocaleDateString('es-PR') + '</div></div>';
  }).join('');
}

function cerrarModales() { document.getElementById('modals').innerHTML = ''; }
document.addEventListener('click', function(e) { if (e.target.classList && e.target.classList.contains('modal')) cerrarModales(); });

if (TOKEN) {
  fetch(API + '/api/auth/me', {headers: {'Authorization': 'Bearer ' + TOKEN}})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var u = d.usuario || d.user;
      if (u && ADMIN_ROLES.includes(u.rol)) { USER = u; initAdmin(); }
      else { localStorage.removeItem('wifnix_admin_token'); }
    })
    .catch(function() { localStorage.removeItem('wifnix_admin_token'); });
}
